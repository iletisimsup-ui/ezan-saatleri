<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ezan Saatleri</title>
<meta name="description" content="Namaz vakitleri, ezan alarmı, kıble, Kur'an-ı Kerim ve dualar.">
<meta property="og:title" content="Ezan Saatleri">
<meta property="og:description" content="Namaz vakitleri, ezan alarmı, kıble, Kur'an-ı Kerim ve dualar.">
<meta property="og:image" content="https://iletisimsup-ui.github.io/ezan-saatleri/ikon.png">
<meta property="og:url" content="https://iletisimsup-ui.github.io/ezan-saatleri/">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary">
<link rel="icon" href="ikon.png">
<link rel="apple-touch-icon" href="ikon.png">
<meta name="theme-color" content="#0A2B18">
<script>
// Tek reklam linki: iPhone/iPad -> App Store, Android -> Google Play, diğerleri -> iki düğmeli sayfa.
(function () {
  var APP_STORE = 'https://apps.apple.com/app/id6798791775';
  var PLAY = 'https://play.google.com/store/apps/details?id=com.ezansaatleritr.app';
  var ua = navigator.userAgent || '';
  var ios = /iPhone|iPad|iPod/i.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1); // iPadOS masaüstü kimliği
  var android = /Android/i.test(ua);
  // Reklam kaynağı (utm_*) Play'e "referrer" olarak aktarılır: Play Console'da kaynağa göre kurulum görülür.
  var q = location.search.replace(/^\?/, '');
  var utm = q.split('&').filter(function (p) { return /^utm_[a-z]+=/.test(p); }).join('&');
  if (utm) PLAY += '&referrer=' + encodeURIComponent(utm);
  window.__magaza = { ios: APP_STORE, play: PLAY };
  if (ios) location.replace(APP_STORE);
  else if (android) location.replace(PLAY);
})();
</script>
<style>
  :root { --bg: #0A2B18; --kart: #0F3A21; --altin: #C9A64B; --yazi: #F2F5F0; --soluk: #9FB3A3; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: radial-gradient(120% 80% at 50% 0%, #134a2a 0%, var(--bg) 60%);
    color: var(--yazi);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans", sans-serif;
    display: flex; align-items: center; justify-content: center;
    padding: max(24px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
  }
  main { width: 100%; max-width: 380px; text-align: center; display: grid; gap: 20px; justify-items: center; }
  img { width: 112px; height: 112px; border-radius: 26px; box-shadow: 0 10px 30px rgba(0,0,0,.35); }
  h1 { margin: 0; font-size: 28px; letter-spacing: .18em; font-weight: 600; }
  h1 span { display: block; font-size: 12px; letter-spacing: .5em; color: var(--altin); margin-top: 6px; font-weight: 600; }
  .dugmeler { display: grid; gap: 12px; width: 100%; }
  a.magaza {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    padding: 15px 18px; border-radius: 14px; text-decoration: none; font-size: 17px; font-weight: 600;
    background: var(--kart); color: var(--yazi); border: 1px solid rgba(201,166,75,.45);
  }
  a.magaza:hover, a.magaza:focus-visible { border-color: var(--altin); outline: none; background: #144a2b; }
  a.magaza svg { width: 22px; height: 22px; fill: currentColor; flex: none; }
  .yonlendirme { color: var(--soluk); font-size: 13px; margin: 0; }
</style>
</head>
<body>
<main>
  <img src="ikon.png" alt="" width="112" height="112">
  <h1>EZAN<span>SAATLERİ</span></h1>
  <div class="dugmeler">
    <a class="magaza" id="ios" href="https://apps.apple.com/app/id6798791775">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16.37 12.63c-.02-2.2 1.8-3.26 1.88-3.31-1.03-1.5-2.62-1.7-3.18-1.73-1.35-.14-2.64.8-3.33.8-.69 0-1.74-.78-2.87-.76-1.47.02-2.83.86-3.59 2.18-1.53 2.66-.39 6.59 1.1 8.75.73 1.05 1.6 2.24 2.73 2.2 1.1-.05 1.51-.71 2.84-.71 1.32 0 1.7.71 2.86.69 1.18-.02 1.93-1.07 2.65-2.13.84-1.22 1.18-2.4 1.2-2.46-.03-.01-2.3-.88-2.32-3.52zM14.2 6.17c.6-.73 1.01-1.75.9-2.76-.87.04-1.92.58-2.54 1.31-.56.65-1.05 1.69-.92 2.68.97.08 1.96-.49 2.56-1.23z"/></svg>
      App Store
    </a>
    <a class="magaza" id="play" href="https://play.google.com/store/apps/details?id=com.ezansaatleritr.app">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.6 2.3c-.2.2-.3.6-.3 1v17.4c0 .4.1.8.3 1L13.4 12 3.6 2.3zm10.6 10.5 2.7 2.7-11.6 6.6 8.9-9.3zm0-1.6L5.3 1.9l11.6 6.6-2.7 2.7zm3.8-2.1 3 1.7c.9.5.9 1.9 0 2.4l-3 1.7-3-2.9 3-2.9z"/></svg>
      Google Play
    </a>
  </div>
  <p class="yonlendirme" id="yon" hidden>Mağazaya yönlendiriliyorsunuz…</p>
</main>
<script>
  // Düğmeler de utm'li Play adresini kullansın; telefonda yönlendirme sürerken kısa bir not göster.
  if (window.__magaza) {
    document.getElementById('play').href = window.__magaza.play;
    if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent) || (/Macintosh/.test(navigator.userAgent) && navigator.maxTouchPoints > 1))
      document.getElementById('yon').hidden = false;
  }
</script>
</body>
</html>
